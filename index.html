<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Popisuj, kresli, pantomima</title>
<style>
  :root {
    /* Hra pro malé děti: velká tlačítka, výrazné barvy, málo textu */
    --bg: #fdf8ef;
    --fg: #2b2238;
    --muted: #7a6f87;
    --card: #ffffff;
    --line: #e7dfd0;
    --p1: #ff7a59;   /* Popisuj */
    --p2: #3fb8af;   /* Kresli */
    --p3: #8c6cf0;   /* Pantomima */
    --ok: #3ca55c;
    --skip: #9a8fa7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1827; --fg: #f6f0ff; --muted: #b5a9c7; --card: #2a2236; --line: #3a3149;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1827; --fg: #f6f0ff; --muted: #b5a9c7; --card: #2a2236; --line: #3a3149;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    font-size: 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    min-height: 100vh;
  }
  [hidden] { display: none !important; }
  h1 { font-size: 26px; margin: 0 0 4px; text-align: center; text-wrap: balance; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 18px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 14px; max-width: 520px; margin: 0 auto; }
  button {
    font: inherit; font-weight: 800; cursor: pointer; border: 0; border-radius: 16px;
    padding: 14px 18px; color: #fff; min-height: 56px; touch-action: manipulation;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  button:active { transform: scale(0.98); }
  .btn-main { background: var(--p3); width: 100%; font-size: 20px; }
  .btn-ghost { background: transparent; color: var(--fg); border: 2px solid var(--line); }
  .btn-ok { background: var(--ok); flex: 1; }
  .btn-skip { background: var(--skip); flex: 1; }
  .btn-end { background: var(--muted); flex: 1; }
  label.toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; min-height: 44px; }
  input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--p2); }
  input[type="number"] { font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); width: 90px; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; background: var(--bg); color: var(--fg); border: 2px solid var(--line); min-height: 48px; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* Výběr režimu: tři velké plochy */
  .modes { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .mode {
    display: flex; align-items: center; gap: 16px; text-align: left;
    min-height: 96px; border-radius: 22px; font-size: 22px; padding: 16px 20px;
  }
  .mode .ico { font-size: 44px; line-height: 1; }
  .mode small { display: block; font-size: 15px; font-weight: 600; opacity: 0.92; }
  .m-pop { background: var(--p1); }
  .m-kre { background: var(--p2); }
  .m-pan { background: var(--p3); }

  /* Scóre */
  .scores { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; }
  .team {
    flex: 1 0 auto; min-width: 84px; padding: 8px 10px; border-radius: 14px;
    background: var(--card); border: 2px solid var(--line); text-align: center;
  }
  .team.on { border-color: var(--fg); }
  .team b { display: block; font-size: 15px; }
  .team span { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }

  /* Pojem */
  .card {
    border-radius: 24px; padding: 18px; text-align: center; color: #fff; min-height: 220px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .card .emo { font-size: 96px; line-height: 1; }
  .card .word { font-size: 30px; font-weight: 900; text-wrap: balance; }
  .card.hidden-word .word, .card.hidden-word .emo { filter: blur(14px); user-select: none; }
  .timer {
    font-size: 40px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums;
    margin: 10px 0 0;
  }
  .timer.low { color: #e0453a; }
  .hint { text-align: center; color: var(--muted); font-size: 15px; margin: 6px 0 0; }

  canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; max-width: 100%;
    background: #fff; border-radius: 16px; border: 2px solid var(--line); touch-action: none;
    margin-top: 12px;
  }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .tools { display: flex; gap: 8px; margin-top: 8px; }
  .tools button { background: var(--bg); color: var(--fg); border: 2px solid var(--line); min-height: 44px; flex: 1; font-size: 16px; }

  @media (min-width: 520px) {
    .modes { grid-template-columns: repeat(3, 1fr); }
    .mode { flex-direction: column; text-align: center; justify-content: center; }
  }
</style>

<h1>Popisuj, kresli, pantomima</h1>
<p class="sub" id="subtitle">Hra pro malé i velké hráče</p>

<!-- NASTAVENÍ -->
<section id="setup" class="stack">
  <div class="panel">
    <label class="toggle"><input type="checkbox" id="optFree"> Volná hra bez bodů</label>
    <p class="hint" style="margin:4px 0 0">Jen se střídáme a ukazujeme, bez soutěže.</p>
  </div>

  <div class="panel" id="teamPanel">
    <p style="margin:0 0 8px;font-weight:800">Počet týmů</p>
    <div class="seg" id="teamSeg">
      <button data-n="2" aria-pressed="true">2</button>
      <button data-n="3" aria-pressed="false">3</button>
      <button data-n="4" aria-pressed="false">4</button>
    </div>
  </div>

  <div class="panel">
    <label class="toggle"><input type="checkbox" id="optDraw" checked> Hrát i část Kresli</label>
    <label class="toggle"><input type="checkbox" id="optTimer" checked> Časový limit kola</label>
    <div class="row" id="timerRow" style="margin-top:8px">
      <span>Délka (sekundy):</span>
      <input type="number" id="optSecs" value="60" min="10" max="600" step="5" inputmode="numeric">
    </div>
  </div>

  <div class="panel">
    <p style="margin:0 0 8px;font-weight:800">Co se ukazuje na kartě</p>
    <div class="seg" id="showSeg">
      <button data-v="both" aria-pressed="true">Text i obrázky</button>
      <button data-v="img" aria-pressed="false">Jen obrázky</button>
      <button data-v="text" aria-pressed="false">Jen text</button>
    </div>
  </div>

  <button class="btn-main" id="startBtn">Začít hru</button>
</section>

<!-- HRA: výběr režimu -->
<section id="pickView" class="stack" hidden>
  <div class="scores" id="scoresPick"></div>
  <p class="sub" style="margin:0">Na tahu je: <b id="turnNamePick"></b></p>
  <div class="modes">
    <button class="mode m-pop" id="pickPop">
      <span class="ico">👀</span>
      <span>Popisuj<small>Popisuj, ale neříkej slovo</small></span>
    </button>
    <button class="mode m-kre" id="pickKre">
      <span class="ico">🖍️</span>
      <span>Kresli<small>Nakresli prstem na obrazovku</small></span>
    </button>
    <button class="mode m-pan" id="pickPan">
      <span class="ico">🤸</span>
      <span>Pantomima<small>Předváděj bez mluvení</small></span>
    </button>
  </div>
  <button class="btn-ghost" id="endGameBtn" style="min-height:48px">Ukončit hru</button>
</section>

<!-- HRA: kolo -->
<section id="roundView" class="stack" hidden>
  <div class="scores" id="scoresRound"></div>
  <p class="sub" style="margin:0"><b id="roundMode"></b> · <b id="roundTurn"></b></p>

  <div class="card" id="card">
    <div class="emo" id="emo"></div>
    <div class="word" id="word"></div>
  </div>

  <div class="row" style="justify-content:center">
    <button class="btn-ghost" id="toggleWord" style="min-height:44px">Schovat pojem</button>
  </div>

  <div id="timerWrap" hidden>
    <div class="timer" id="timer"></div>
  </div>

  <div id="drawWrap" hidden>
    <canvas id="pad" width="800" height="600" aria-label="Plátno pro kreslení"></canvas>
    <div class="tools">
      <button id="clearPad">Smazat kresbu</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn-ok" id="okBtn">Uhodnuto</button>
    <button class="btn-skip" id="skipBtn">Přeskočit</button>
  </div>
  <button class="btn-end" id="roundEndBtn" style="width:100%">Konec kola</button>
</section>

<script>
(function () {
  // Pojmy: [slovo, emoji]. Seznam z revize.
  var WORDS = [
    ["kočka","🐱"],["pes","🐶"],["kráva","🐮"],["slon","🐘"],["žirafa","🦒"],["žába","🐸"],
    ["kohout","🐓"],["medvěd","🐻"],["ryba","🐟"],["motýl","🦋"],["kachna","🦆"],["zajíc","🐰"],
    ["lev","🦁"],["opice","🐵"],["kůň","🐴"],["prase","🐷"],["husa","🦢"],["krokodýl","🐊"],["čáp","🐦"],
    ["židle","🪑"],["postel","🛏️"],["lžíce","🥄"],["hrnec","🍲"],["deštník","☂️"],["hodiny","⏰"],
    ["kytka","💐"],["kniha","📖"],["klíče","🔑"],["boty","👢"],["klobouk","🎩"],["telefon","📱"],
    ["auto","🚗"],["vlak","🚆"],["letadlo","✈️"],["vozík","🛒"],["vana","🛁"],["pračka","🧺"],
    ["lampa","💡"],["okno","🪟"],["dveře","🚪"],["čepice","🧢"],["rukavice","🧤"],["šála","🧣"],
    ["kolo","🚲"],["loď","⛵"],["tablet","📲"],["notebook","💻"],["oči","👀"],["nos","👃"],
    ["školka","🏫"],["babička","👵"],["dědeček","👴"],["kamna","🔥"],["kostel","⛪"],
    ["slunce","☀️"],["déšť","🌧️"],["sníh","❄️"],["duha","🌈"],["strom","🌳"],["hvězda","⭐"],
    ["měsíc","🌙"],["sopka","🌋"],["mrak","☁️"],["list","🍃"],
    ["jablko","🍎"],["banán","🍌"],["mrkev","🥕"],["dort","🎂"],["zmrzlina","🍦"],["chleba","🍞"],
    ["hruška","🍐"],["meloun","🍉"],["pizza","🍕"],["mléko","🥛"],["vejce","🥚"],
    ["plavání","🏊"],["skákání","🤸"],["spaní","😴"],["hasič","🚒"],["policista","👮"],
    ["doktor","🩺"],["kuchař","👨‍🍳"],["pejskař","🦮"],["zpěvák","🎤"],["tanečnice","💃"],
    ["Červená Karkulka","🧕"],["Popelka","👠"],["Krtek","🕳️"],["Čert","😈"],["Pohádkový drak","🐉"],
    ["Princezna","👸"],["Rytíř","🛡️"],["Čarodějnice","🧙"],
    ["vrtačka","🔧"],["kladivo","🔨"],["pila","🪚"],["šroubovák","🪛"],["metr","📏"],["štětec","🖌️"],
    ["lopata","⛏️"],["hrábě","🧹"],["kleště","🗜️"]
  ];

  var COLORS = { pop: "var(--p1)", kre: "var(--p2)", pan: "var(--p3)" };
  var MODE_NAMES = { pop: "Popisuj", kre: "Kresli", pan: "Pantomima" };

  var state = {
    teams: 2, names: [], scores: [], turn: 0,
    drawOn: true, timerOn: true, secs: 60,
    mode: null, word: null, used: [], left: 0, tick: null, hidden: false, show: "both"
  };

  var showSeg = $("showSeg");
  showSeg.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.show = b.dataset.v;
    Array.prototype.forEach.call(showSeg.children, function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
  });

  function applyDisplay() {
    $("emo").hidden = state.show === "text";
    $("word").hidden = state.show === "img";
  }

  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).hidden = !on; }
  function showOnly(id) {
    ["setup", "pickView", "roundView"].forEach(function (v) { show(v, v === id); });
  }

  // Nastavení
  var teamSeg = $("teamSeg");
  teamSeg.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.teams = +b.dataset.n;
    Array.prototype.forEach.call(teamSeg.children, function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
  });
  function syncTimerRow() { show("timerRow", $("optTimer").checked); }
  $("optTimer").addEventListener("change", syncTimerRow);
  syncTimerRow();

  function syncFree() { show("teamPanel", !$("optFree").checked); }
  $("optFree").addEventListener("change", syncFree);
  syncFree();

  $("startBtn").addEventListener("click", function () {
    state.free = $("optFree").checked;
    state.drawOn = $("optDraw").checked;
    state.timerOn = $("optTimer").checked;
    var s = parseInt($("optSecs").value, 10);
    state.secs = isNaN(s) ? 60 : Math.min(600, Math.max(10, s));
    state.names = [];
    state.scores = [];
    var n = state.free ? 1 : state.teams;
    for (var i = 0; i < n; i++) { state.names.push("Tým " + (i + 1)); state.scores.push(0); }
    state.turn = 0;
    state.used = [];
    $("pickPop").hidden = false;
    $("turnNamePick").parentElement.hidden = state.free;
    $("scoresPick").hidden = state.free;
    $("pickKre").hidden = !state.drawOn;
    $("pickPan").hidden = false;
    renderScores("scoresPick");
    showOnly("pickView");
  });

  function renderScores(containerId) {
    var box = $(containerId);
    box.innerHTML = "";
    if (state.free) {
      $("turnNamePick").textContent = "";
      $("roundTurn").textContent = "";
      $("okBtn").textContent = "Uhodnuto";
      return;
    }
    $("okBtn").textContent = "Uhodnuto";
    state.names.forEach(function (n, i) {
      var d = document.createElement("div");
      d.className = "team" + (i === state.turn ? " on" : "");
      d.innerHTML = "<b></b><span></span>";
      d.querySelector("b").textContent = n;
      d.querySelector("span").textContent = state.scores[i];
      box.appendChild(d);
    });
    $("turnNamePick").textContent = state.names[state.turn];
  }

  function pickWord() {
    if (state.used.length >= WORDS.length) state.used = [];
    var idx;
    do { idx = Math.floor(Math.random() * WORDS.length); }
    while (state.used.indexOf(idx) !== -1);
    state.used.push(idx);
    return WORDS[idx];
  }

  function setWord() {
    var w = pickWord();
    state.word = w;
    $("emo").textContent = w[1];
    $("word").textContent = w[0];
    applyDisplay();
    applyHidden();
  }

  function applyHidden() {
    $("card").classList.toggle("hidden-word", state.hidden);
    $("toggleWord").textContent = state.hidden ? "Ukázat pojem" : "Schovat pojem";
  }

  // Kolo
  function startRound(mode) {
    state.mode = mode;
    state.hidden = false;
    $("roundMode").textContent = MODE_NAMES[mode];
    $("card").style.background = COLORS[mode];
    renderScores("scoresRound");
    show("drawWrap", mode === "kre");
    if (mode === "kre") clearPad();
    show("timerWrap", state.timerOn);
    setWord();
    startTimer();
    showOnly("roundView");
  }

  function startTimer() {
    stopTimer();
    if (!state.timerOn) return;
    state.left = state.secs;
    renderTimer();
    state.tick = setInterval(function () {
      state.left -= 1;
      renderTimer();
      if (state.left <= 0) {
        stopTimer();
        $("timer").textContent = "Čas!";
        setTimeout(function () { endRound(); }, 1200);
      }
    }, 1000);
  }
  function stopTimer() { if (state.tick) { clearInterval(state.tick); state.tick = null; } }
  function renderTimer() {
    var t = $("timer");
    t.textContent = state.left + " s";
    t.classList.toggle("low", state.left <= 10);
  }

  $("okBtn").addEventListener("click", function () {
    if (state.free) {
      stopTimer();
      showOnly("pickView");
      return;
    }
    state.scores[state.turn] += 1;
    endRound();
  });
  $("skipBtn").addEventListener("click", function () { setWord(); });
  $("roundEndBtn").addEventListener("click", function () { endRound(); });
  $("toggleWord").addEventListener("click", function () {
    state.hidden = !state.hidden; applyHidden();
  });

  function endRound() {
    stopTimer();
    state.turn = (state.turn + 1) % state.teams;
    renderScores("scoresPick");
    showOnly("pickView");
  }

  $("pickPop").addEventListener("click", function () { startRound("pop"); });
  $("pickKre").addEventListener("click", function () { startRound("kre"); });
  $("pickPan").addEventListener("click", function () { startRound("pan"); });

  $("endGameBtn").addEventListener("click", function () {
    stopTimer();
    showOnly("setup");
  });

  // Plátno pro kreslení
  var pad = $("pad"), ctx = pad.getContext("2d"), drawing = false, last = null;
  function pos(e) {
    var r = pad.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (pad.width / r.width),
      y: (e.clientY - r.top) * (pad.height / r.height)
    };
  }
  pad.addEventListener("pointerdown", function (e) {
    drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId);
  });
  pad.addEventListener("pointermove", function (e) {
    if (!drawing) return;
    var p = pos(e);
    ctx.strokeStyle = "#2b2238"; ctx.lineWidth = 10; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  function stopDraw() { drawing = false; last = null; }
  pad.addEventListener("pointerup", stopDraw);
  pad.addEventListener("pointercancel", stopDraw);
  function clearPad() { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, pad.width, pad.height); }
  $("clearPad").addEventListener("click", clearPad);
  clearPad();
})();
</script>
